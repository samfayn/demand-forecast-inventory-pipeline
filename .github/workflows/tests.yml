name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: pytest -v --cov=pipeline --cov=data_prep --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install pyflakes

      - name: Check for unused imports, undefined names, and other issues
        run: pyflakes src/ tests/ scripts/ app.py

      - name: Validate requirements files parse
        # A malformed requirements file fails the test jobs during dependency
        # install, which reads as a broken test suite rather than a broken
        # file. Parsing them here names the real problem in seconds.
        run: |
          pip install packaging
          python - <<'PY'
          import re, sys
          from packaging.requirements import Requirement

          # pip only treats '#' as a comment when it starts a line or follows
          # whitespace. 'jupyter>=1.0# comment' is one malformed requirement,
          # not a requirement plus a comment — which is what a duplicated file
          # with no trailing newline produces.
          COMMENT = re.compile(r'(^|\s)#.*$')

          bad = []
          for path in ('requirements.txt', 'requirements-dev.txt'):
              for n, line in enumerate(open(path), 1):
                  line = COMMENT.sub('', line).strip()
                  if not line or line.startswith('-'):
                      continue
                  try:
                      Requirement(line)
                  except Exception as e:
                      bad.append(f"{path}:{n}: {line!r} -> {e}")

          if bad:
              print("Malformed requirement lines:")
              for b in bad:
                  print("  " + b)
              sys.exit(1)
          print("requirements files parse cleanly")
          PY